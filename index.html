<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Centre</title>
<meta name="apple-mobile-web-app-title" content="Command Centre">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest?v=3">
<meta name="theme-color" content="#000000">
<script>
  var TARGET = "https://claude.ai/artifact/CuPvpiTJLcU2LUi6wg7Apk";
  var launched = /(^|[?&])go\b/.test(location.search) ||
    window.matchMedia('(display-mode: standalone)').matches;
  if (launched) { location.replace(TARGET); }
</script>
<style>
  body{margin:0;background:#000;color:#e8fff4;font:16px/1.5 -apple-system,system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:16px;box-sizing:border-box}
  img{width:120px;height:120px;border-radius:26px}
  .btn{display:inline-block;margin-top:14px;padding:12px 20px;border-radius:10px;background:#7afec1;color:#000;text-decoration:none;font-weight:600;border:0;font-size:16px}
  .ghost{background:transparent;color:#7afec1;border:1px solid #7afec1}
  p{max-width:340px;margin:12px auto;color:#b8d9c9}
  #install{display:none}
</style>
</head>
<body>
<main>
  <img src="apple-touch-icon.png" alt="Enso">
  <h1 style="font-size:20px;margin:16px 0 4px">TKR Command Centre</h1>
  <button id="install" class="btn">Install on this phone</button>
  <p id="how"><b>Android (Chrome):</b> tap the three dots at the top right, then <b>Install app</b> or <b>Add to Home screen</b>.<br><b>iPhone (Safari):</b> tap Share, then <b>Add to Home Screen</b>.</p>
  <a class="btn ghost" href="https://claude.ai/artifact/CuPvpiTJLcU2LUi6wg7Apk">Open now</a>
</main>
<script>
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
  var deferred = null, btn = document.getElementById('install');
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e; btn.style.display = 'inline-block';
  });
  btn.addEventListener('click', function () {
    if (!deferred) return; deferred.prompt();
    deferred.userChoice.finally(function () { deferred = null; btn.style.display = 'none'; });
  });
  window.addEventListener('appinstalled', function () {
    document.getElementById('how').textContent = 'Installed. Use the Command Centre icon on your home screen.';
  });
  // iPhone saves the current address: make it the one that forwards to the dashboard.
  if (!launched) { history.replaceState(null, "", "./?go"); }
</script>
</body>
</html>
